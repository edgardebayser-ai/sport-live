name: SPORT LIVE — actualisation quotidienne à 7 h (Paris)

on:
  schedule:
    # Run at both possible UTC equivalents of 07:00 Europe/Paris.
    # The Python script proceeds only when the local Paris clock is 07:xx.
    - cron: "0 5,6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer la mise à jour maintenant (sans attendre 7 h)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actualiser les données sportives
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          FORCE_REFRESH: ${{ inputs.force && '1' || '0' }}
        run: python scripts/update_data.py
      - name: Publier le nouveau cache de données
        run: |
          if git diff --quiet -- data/sports.json; then
            echo "Aucune modification des données."
            exit 0
          fi
          git config user.name "sport-live-bot"
          git config user.email "sport-live-bot@users.noreply.github.com"
          git add data/sports.json
          git commit -m "Mise à jour quotidienne des données sportives"
          git push
